name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # 端到端：bedrock-cui create 新建项目 → build --pack（sapdon）
      - run: node scripts/e2e-create.mjs
      # 手册：链接与代码块；API 参考与源码一致（API 改了而参考没更新就失败）
      - run: npm run docs:check
      - run: npm run docs:api && git diff --exit-code -- docs/guide/reference docs/guide/components
