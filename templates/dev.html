<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bedrock-cui 预览</title>
<style>
    :root { --bg: #f6f6f7; --panel: #fff; --line: #e2e2e3; --text: #213547; --soft: #6b7785; --brand: #2f7d4a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1f; --panel: #202127; --line: #2e2e32; --text: #dfdfd6; --soft: #98989f; --brand: #5fbf7f; } }
    * { box-sizing: border-box; }
    body { margin: 0; display: grid; grid-template-columns: 220px 1fr 300px; height: 100vh; background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    aside, section { overflow: auto; }
    #screens { padding: 16px; border-right: 1px solid var(--line); background: var(--panel); }
    #screens h1 { font-size: 15px; margin: 0 0 12px; }
    #screens a { display: block; padding: 4px 8px; border-radius: 6px; color: var(--soft); text-decoration: none; word-break: break-all; }
    #screens a.active { background: var(--bg); color: var(--brand); font-weight: 600; }
    #stage { display: flex; flex-direction: column; align-items: center; padding: 24px; gap: 12px; }
    #issues { width: 100%; max-width: 900px; font-size: 13px; }
    #issues div { padding: 4px 8px; border-left: 3px solid #d29b00; margin: 4px 0; background: var(--panel); }
    #form { padding: 16px; border-left: 1px solid var(--line); background: var(--panel); }
    #form h2 { font-size: 13px; margin: 0 0 8px; }
    #form label { display: block; margin: 12px 0 4px; color: var(--soft); font-size: 12px; }
    #form input, #form textarea { width: 100%; font: 13px/1.5 ui-monospace, Consolas, monospace; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
    #form textarea { min-height: 120px; resize: vertical; }
    #log { margin-top: 12px; font-size: 12px; color: var(--soft); white-space: pre-wrap; }
</style>
</head>
<body>
<aside id="screens"><h1>界面</h1><nav></nav></aside>
<section id="stage"></section>
<aside id="form">
    <h2>表单数据</h2>
    <label>标题（ActionFormData.title）</label><input id="f-title">
    <label>正文（ActionFormData.body）</label><textarea id="f-text"></textarea>
    <label>按钮（每行一个，按序号；带图标写成「文字 @ 图标路径」）</label><textarea id="f-buttons"></textarea>
    <div id="log"></div>
</aside>
<script type="module" src="/@cui/dev.js"></script>
</body>
</html>
